apis:
- aid: cvent-platform:rest-api
  name: Cvent Platform REST API
  description: >-
    The Cvent Platform REST API is the unified RESTful interface across the Event Cloud product line,
    providing programmatic access to events, contacts, registrations, attendees, sessions, speakers, exhibitors,
    surveys, webhooks, and Attendee Hub resources. The API uses OAuth 2.0 client credentials. Authorization
    code flow is available to planner administrators. Developers can download the OpenAPI specification
    from the API reference.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/rest-api/overview
  baseURL: https://api-platform.cvent.com
