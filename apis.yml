- aid: cvent-platform:passkey-reglink
  name: Cvent Passkey RegLink API
  description: >-
    Passkey RegLink APIs are RESTful JSON APIs (with legacy URL-based and SOAP options) connecting Cvent
    with external registration and reservation applications. Primary functions include streamlining the
    hotel reservation process by sending registrant information to Passkey, fetching event details and
    hotel room availability, retrieving reservation information, and creating, updating, and cancelling
    registrant hotel reservations.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/passkey/REST/overview
